;; PgBouncer in front of Postgres, doing connection multiplexing for the FastAPI
;; replicas (the RDS-Proxy role). Mounted read-only into the edoburu/pgbouncer
;; image, which runs pgbouncer with this file instead of generating one.

[databases]
;; Route the "bank" database to the real Postgres container.
bank = host=db port=5432 dbname=bank

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; Clients (app + exporter) authenticate against userlist.txt. It holds the
;; password in plaintext so pgbouncer can in turn negotiate scram-sha-256 with
;; Postgres 17 (whose default password_encryption is scram-sha-256).
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; `postgres` may use the admin console (SHOW STATS/POOLS/...) which the
;; pgbouncer-exporter scrapes.
admin_users = postgres
stats_users = postgres

;; Transaction pooling = real multiplexing: a server connection is assigned to a
;; client only for the length of each transaction, then returned to the pool.
pool_mode = transaction

;; Up to 200 client connections (across all app replicas) collapse onto at most
;; default_pool_size server connections per (user, db) pair.
max_client_conn = 200
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

;; asyncpg sends this startup parameter; let pgbouncer accept it in txn mode.
ignore_startup_parameters = extra_float_digits
