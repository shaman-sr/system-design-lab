;; PgBouncer in front of Postgres, doing connection multiplexing for the FastAPI
;; replicas (the RDS-Proxy role). Mounted read-only into the edoburu/pgbouncer
;; image, which runs pgbouncer with this file instead of generating one.

[databases]
;; Route the "bank" database to the real Postgres container.
bank = host=db port=5432 dbname=bank

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; Clients (app + exporter) authenticate against userlist.txt. It holds the
;; password in plaintext so pgbouncer can in turn negotiate scram-sha-256 with
;; Postgres 17 (whose default password_encryption is scram-sha-256).
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; `postgres` may use the admin console (SHOW STATS/POOLS/...) which the
;; pgbouncer-exporter scrapes.
admin_users = postgres
stats_users = postgres

;; Transaction pooling = real multiplexing: a server connection is assigned to a
;; client only for the length of each transaction, then returned to the pool.
pool_mode = transaction

;; default_pool_size is the DB-throughput knob for this whole stack: it caps how
;; many transactions can hit Postgres concurrently, no matter how many app
;; replicas exist. `--scale app=N` scales the app/HTTP tier; THIS scales the DB
;; tier. It was 20, which flattened horizontal scaling (the whole fleet shared
;; just 20 server connections — tighter than two un-pooled replicas had before).
;; Raised to 90 so scaling has real headroom while PgBouncer still protects
;; Postgres from connection exhaustion. Worst case ~90 + reserve 10 = 100 server
;; connections for the (postgres, bank) pool, which fits under Postgres
;; max_connections=200 (see infra/docker-compose.yml) alongside the direct
;; postgres-exporter connections and the superuser reserve.
;;
;; max_client_conn is the *client* side: the app uses NullPool, so each in-flight
;; request is one client connection to PgBouncer. Under the stress/spike k6
;; scenarios (up to 400 VUs across several replicas) 200 was too low; 500 leaves
;; headroom so clients queue on the pool rather than being refused outright.
max_client_conn = 500
default_pool_size = 90
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 3

;; asyncpg sends this startup parameter; let pgbouncer accept it in txn mode.
ignore_startup_parameters = extra_float_digits
