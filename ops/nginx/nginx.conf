# Load balancer in front of the FastAPI `app` replicas.
#
# nginx resolves upstream hostnames once at worker startup by default, which would
# pin every request to whichever replica IP it saw first. To spread load across
# replicas that come and go with `docker compose up --scale app=N`, we:
#   1. point nginx at Docker's embedded DNS server (127.0.0.11), and
#   2. put the upstream in a $variable, which forces nginx to re-resolve the name
#      per request via that resolver. Docker DNS returns all replica A-records and
#      nginx round-robins across them.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 8000;

  location / {
    set $upstream app:8000;
    proxy_pass http://$upstream;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
