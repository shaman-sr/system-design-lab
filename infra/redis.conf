# Allow connections from any IP inside the container network
bind 0.0.0.0

# Set a strong password for authentication
requirepass MySecurePassword123

# Keep data safe by enabling Append Only File (AOF) persistence
appendonly yes
appendfsync everysec

# Limit max memory usage (tweak based on your host)
maxmemory 256mb
maxmemory-policy allkeys-lru
