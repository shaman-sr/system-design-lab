services:

  db:
    # Pinned major version for a reproducible lab. Postgres 18 changed its
    # data-directory layout and refuses the classic /var/lib/postgresql/data
    # mount used below, so we pin to 17.
    image: postgres:17
    restart: always
    # max_connections must sit ABOVE PgBouncer's ceiling (default_pool_size 90 +
    # reserve_pool_size 10 = up to 100 server connections for the bank pool) plus
    # the direct postgres-exporter connections and Postgres's own superuser
    # reserve (3). 100 (the stock default) left no room once the pool was widened,
    # so raise it to 200. shm_size is bumped to 4gb to give those backends ample
    # shared-memory headroom under the stress/spike load tests.
    command: ["postgres", "-c", "max_connections=200"]
    shm_size: 4gb
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_USER: postgres
      POSTGRES_DB: bank
    volumes:
        - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bank"]
      interval: 2s
      timeout: 3s
      retries: 10


  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    # No host port mapping: with `--scale app=N` the replicas can't all bind the
    # same host port. They're reachable on the compose network as app:8000 and
    # fronted by the app_lb (nginx) service below.
    depends_on:
      pgbouncer:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      # Route the app through PgBouncer (transaction pooling) instead of hitting
      # Postgres directly, so the replicas multiplex onto a small server pool.
      - DATABASE_URL=postgresql://postgres:mysecretpassword@pgbouncer:6432/bank
      - REDIS_URL=redis://:MySecurePassword123@redis:6379/0

  # Connection pooler / multiplexer in front of Postgres (the RDS-Proxy role).
  # Config is mounted from ../ops/pgbouncer; the edoburu image runs pgbouncer
  # with those files rather than generating its own.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    volumes:
      - ../ops/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ../ops/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy

  # Exposes PgBouncer's SHOW STATS/POOLS as Prometheus metrics (pool size,
  # waiting clients, server/client connection counts).
  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:latest
    restart: unless-stopped
    command:
      - "--pgBouncer.connectionString=postgres://postgres:mysecretpassword@pgbouncer:6432/pgbouncer?sslmode=disable"
    depends_on:
      - pgbouncer

  # Load balancer for the FastAPI replicas. Publishes host 8000 and round-robins
  # across all `app` replicas (see ../ops/nginx/nginx.conf). This is what k6 and
  # curl hit on localhost:8000.
  app_lb:
    image: nginx:1.27
    restart: unless-stopped
    ports:
      - 8000:8000
    volumes:
      - ../ops/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # --- Observability stack ---------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - 9090:9090
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # Required so k6 can push its metrics in via remote-write.
      - "--web.enable-remote-write-receiver"
      # Allows POST /-/reload to hot-reload config (used by the container
      # name-mapping script so you don't have to restart Prometheus).
      - "--web.enable-lifecycle"
    volumes:
      - ../ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ../ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  # Exposes Postgres internals (connections, commits/rollbacks, locks) as metrics.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:mysecretpassword@db:5432/bank?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    container_name: redis_server
    restart: always
    ports:
      - "6379:6379"
    volumes:
      # Mount your custom config file into the container
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      # Mount a named volume to persist Redis data permanently
      - redis_data:/data
    # Overwrite default startup command to execute using your custom config file
    command: redis-server /usr/local/etc/redis/redis.conf
    # The app's depends_on waits for `service_healthy`, so Redis must report health.
    # PING must authenticate because redis.conf sets requirepass.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a MySecurePassword123 ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 10

  # Exposes Redis internals (keyspace hits/misses, memory, evictions, clients) as
  # Prometheus metrics so the dashboard can show the cache hit ratio.
  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=MySecurePassword123
    depends_on:
      redis:
        condition: service_healthy

  # Per-container CPU / memory / network / filesystem metrics.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    # Adminer already uses host 8080, so publish cAdvisor on 8081.
    ports:
      - 8081:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    devices:
      - /dev/kmsg

volumes:
  pgdata:
  redis_data:
    driver: local
  promdata:
  grafanadata:
